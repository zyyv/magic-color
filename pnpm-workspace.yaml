ignoreWorkspaceRootCheck: true

minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@vueuse/core@15.0.0'
  - '@vueuse/metadata@15.0.0'
  - '@vueuse/shared@15.0.0'
  - unplugin-vue@8.0.0
  - unplugin@3.4.0

trustPolicy: no-downgrade
autoInstallPeers: true
strictPeerDependencies: false
shamefullyHoist: true
shellEmulator: true

packages:
  - playground
  - packages/*

allowBuilds:
  esbuild: true
  pnpm: true
  simple-git-hooks: true
  workerd: true

catalogs:
  cli:
    '@antfu/eslint-config': ^9.5.1
    '@antfu/ni': ^30.6.0
    '@arethetypeswrong/core': ^0.18.5
    bumpp: ^12.3.0
    eslint: ^10.12.0
    esno: ^4.8.0
    lint-staged: ^17.6.0
    pnpm: ^12.11.2
    premove: ^4.0.0
    simple-git-hooks: ^2.14.0
    taze: ^21.3.0
    tsdown: ^0.23.1
    vite: ^8.3.4
    vitest: ^5.0.3
    vue-tsc: ^3.3.13
    wrangler: ^4.149.0

  icons:
    '@iconify-json/akar-icons': ^1.2.7
    '@iconify-json/carbon': ^1.2.28
    '@iconify-json/fluent-emoji': ^1.2.7
    '@iconify-json/logos': ^1.2.16
    '@iconify/utils': ^3.1.7

  playground:
    '@vitejs/plugin-vue': ^6.0.10
    '@vueuse/core': ^15.0.0
    chart.js: ^4.5.1
    gsap: ^3.15.0
    prettier: ^3.9.10
    shiki: ^4.5.0
    unplugin-auto-import: ^21.1.0
    unplugin-vue: ^8.0.0
    unplugin-vue-components: ^32.1.0
    vue: ^3.5.43

  types:
    '@types/node': ^26.6.5
    typescript: 6.0.3

  uno:
    unocss: ^66.11.0
    unocss-preset-useful: ^1.0.1
