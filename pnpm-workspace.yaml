allowBuilds:
  esbuild: true
  pnpm: true
  simple-git-hooks: true

catalog:
  '@primeuix/themes': ^3.0.0
  '@primevue/auto-import-resolver': ^5.0.1
  primevue: ^5.0.1

catalogs:
  cli:
    '@antfu/eslint-config': ^9.5.1
    '@antfu/ni': ^30.6.0
    '@arethetypeswrong/cli': 0.17.1
    bumpp: ^12.3.0
    eslint: ^10.10.0
    esno: ^4.8.0
    lint-staged: ^17.5.1
    pnpm: ^12.4.2
    premove: ^4.0.0
    simple-git-hooks: ^2.14.0
    taze: ^21.1.0
    tsdown: ^0.23.0
    vite: ^8.3.0
    vitest: ^5.0.1
    vue-tsc: ^3.3.11

  icons:
    '@iconify-json/akar-icons': ^1.2.7
    '@iconify-json/carbon': ^1.2.27
    '@iconify-json/fluent-emoji': ^1.2.7
    '@iconify-json/logos': ^1.2.14
